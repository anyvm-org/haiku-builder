
VM_ISO_LINK="https://mirrors.tnonline.net/haiku/haiku-release/r1beta6/haiku-r1beta6-x86_64-anyboot.iso"

VM_OS_NAME="haiku"
VM_SSH_PORT=2223

VM_ROOT_PASSWORD="anyvm.org"

VM_RELEASE=r1beta6

VM_SHUTDOWN_CMD="shutdown -q"

VM_INSTALL_CMD="pkgman install -y "


VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs_fuse"


VM_DISK="ide"


# Every package comes from the normal HaikuPorts repo -- deliberately NO
# VM_INSTALL_SCRIPT and no pinned .hpkg snapshot. r1beta5 needs one only
# because upstream retired its branch repo; that is not the case here.
# Measured 2026-08-25 with curl -sSI on
# eu.hpkg.haiku-os.org/haikuports/<rel>/x86_64/current/repo:
#   r1beta5 -> content-length 2          (retired, empty index)
#   r1beta6 -> content-length 2443335    (live, Last-Modified 2026-08-26)
# conf/haiku-r1beta5-pinned-pkgs.sh states the same rule itself ("a
# future r1beta6 conf must NOT reuse it"): it is release-scoped by
# construction, since its .hpkg versions are beta5-era and unsolvable
# against a beta6 base. This is also why the upstream watcher refuses to
# land r1beta6 on its own -- VM_INSTALL_SCRIPT is not an answer file, so
# it cannot derive the companion, and it says "land this release by
# hand" rather than copying a script that would not work.
VM_PRE_INSTALL_PKGS="rsync sshfs_fuse tree cpio"

VM_LOGIN_TAG="Trash"

VM_OPTS="conf/haiku-r1beta6.opts.txt"


# nfs needs no guest package: Haiku ships the in-kernel nfs4 add-on
# (NFSv4.0 client, port= and proto=tcp supported), so the image gains it
# purely from the anyvm.py haiku mount branch.
VM_SYNC_METHODS="rsync,scp,nfs,sshfs,tar"
